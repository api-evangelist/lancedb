- aid: lancedb:lance-format
  name: Lance Format
  description: >-
    Apache 2.0 open lakehouse format for multimodal AI. Columnar Parquet replacement offering 100x faster
    random access, zero-copy reads, vector indexes, and automatic data versioning. Convertible from Parquet
    in two lines of code. Maintained by the lance-format community.
  humanURL: https://lance.org/
  baseURL: https://github.com/lance-format/lance
  tags:
