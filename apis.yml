apis:
- aid: lancedb:enterprise
  name: LanceDB Enterprise
  description: >-
    Distributed, multi-tenant multimodal lakehouse. Adds curation and deduplication, Python UDF feature
    engineering, materialized views, GPU-accelerated index build via cuVS, distributed query, and direct
    training integration with PyTorch / Ray. Deployable in customer VPC on AWS, GCP, or Azure.
  humanURL: https://lancedb.com/
  baseURL: https://lancedb.com/
  tags:
