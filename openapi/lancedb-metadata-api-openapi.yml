            type: string
          description: Names of columns to drop
    TableVersion:
      type: object
      required:
      - version
      - manifest_path
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version number
        manifest_path:
          type: string
          description: Path to the manifest file for this version.
        manifest_size:
          type: integer
          format: int64
          minimum: 0
          description: Size of the manifest file in bytes
        e_tag:
          type: string
          description: 'Optional ETag for optimistic concurrency control.

            Useful for S3 and similar object stores.

            '
        timestamp_millis:
          type: integer
          format: int64
          description: Timestamp when the version was created, in milliseconds since epoch (Unix time)
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional key-value pairs of metadata
    GetTableStatsRequest:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
    BatchCommitTablesResponse:
      type: object
      description: 'Response for a batch commit of table operations.

        Contains the results of each operation in the same order as the request.

        '
      required:
      - results
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier for the batch commit
        results:
          type: array
          items:
            $ref: '#/components/schemas/CommitTableResult'
          description: 'Results for each operation, in the same order as the request operations.

            Each result contains the outcome of the corresponding operation.

            '
    UpdateTableTagRequest:
      type: object
      required:
      - tag
      - version
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
