        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        tag:
          type: string
          description: Name of the tag to update
        version:
          type: integer
          format: int64
          minimum: 0
          description: New version number for the tag to point to
    CountTableRowsRequest:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        version:
          description: 'Version of the table to describe.

            If not specified, server should resolve it to the latest version.

            '
          type: integer
          format: int64
          minimum: 0
        predicate:
          description: 'Optional SQL predicate to filter rows for counting

            '
          type: string
    Operator:
      type: string
      description: 'The operator to use for combining terms.

        Case insensitive, supports both PascalCase and snake_case. Valid values are:

        - And: All terms must match.

        - Or: At least one term must match.

        '
    AnalyzeTableQueryPlanRequest:
      type: object
      required:
      - vector
      - k
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        bypass_vector_index:
          type: boolean
          description: Whether to bypass vector index
        columns:
          type: object
          nullable: true
          description: 'Optional columns to return. Provide either column_names or column_aliases, not both.

            '
          properties:
            column_names:
              type: array
              items:
                type: string
              description: List of column names to return
            column_aliases:
              type: object
              additionalProperties:
                type: string
              description: Object mapping output aliases to source column names
        distance_type:
          type: string
          description: Distance metric to use
        ef:
          type: integer
          minimum: 0
          description: Search effort parameter for HNSW index
        fast_search:
          type: boolean
          description: Whether to use fast search
        filter:
          type: string
          description: Optional SQL filter expression
        full_text_query:
          type: object
          nullable: true
          description: Optional full-text search query. Provide either string_query or structured_query, not both.
          properties:
            string_query:
              $ref: '#/components/schemas/StringFtsQuery'
            structured_query:
              $ref: '#/components/schemas/StructuredFtsQuery'
        k:
          type: integer
          minimum: 0
          description: Number of results to return
        lower_bound:
          type: number
          format: float
          description: Lower bound for search
        nprobes:
          type: integer
          minimum: 0
          description: Number of probes for IVF index
        offset:
          type: integer
          minimum: 0
          description: Number of results to skip
        prefilter:
          type: boolean
          description: Whether to apply filtering before vector search
        refine_factor:
          type: integer
          format: int32
          minimum: 0
          description: Refine factor for search
        upper_bound:
          type: number
          format: float
          description: Upper bound for search
        vector:
          type: object
          nullable: true
          description: Query vector(s) for similarity search. Provide either single_vector or multi_vector, not both.
          properties:
            single_vector:
              type: array
              items:
                type: number
                format: float
              description: Single query vector
            multi_vector:
              type: array
              items:
                type: array
                items:
                  type: number
                  format: float
              description: Multiple query vectors for batch search
        vector_column:
          type: string
          description: Name of the vector column to search
        version:
          type: integer
          format: int64
          minimum: 0
          description: Table version to query
        with_row_id:
          type: boolean
          description: If true, return the row id as a column called `_rowid`
    Context:
      type: object
      description: 'Arbitrary context for a request as key-value pairs.

        How to use the context is custom to the specific implementation.


        REST NAMESPACE ONLY

        Context entries are passed via HTTP headers using the naming convention

        `x-lance-ctx-<key>: <value>`. For example, a context entry

        `{"trace_id": "abc123"}` would be sent as the header `x-lance-ctx-trace_id: abc123`.

        '
      additionalProperties:
        type: string
    InsertIntoTableResponse:
      type: object
      description: Response from inserting records into a table
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
    ListTableVersionsResponse:
      type: object
      required:
      - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/TableVersion'
          description: 'List of table versions. When `descending=true`, guaranteed to be ordered from latest to oldest.

            Otherwise, ordering is implementation-defined.

            '
        page_token:
          $ref: '#/components/schemas/PageToken'
    BatchCreateTableVersionsRequest:
      type: object
      description: 'Request to atomically create new version entries for multiple tables.

        The operation is atomic: all versions are created or none are.

        '
      required:
      - entries
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CreateTableVersionEntry'
          description: List of table version entries to create atomically
    CreateTableVersionRequest:
      type: object
      description: 'Request to create a new table version entry.

        This supports `put_if_not_exists` semantics,

        where the operation fails if the version already exists.

        '
      required:
      - version
      - manifest_path
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
          description: The table identifier
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version number to create
        manifest_path:
          type: string
          description: Path to the manifest file for this version
        manifest_size:
          type: integer
          format: int64
          minimum: 0
          description: Size of the manifest file in bytes
        e_tag:
          type: string
          description: Optional ETag for the manifest file
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional metadata for the version
        naming_scheme:
          $ref: '#/components/schemas/ManifestNamingScheme'
    AlterTableAddColumnsResponse:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
          description: The commit version associated with the operation
          minimum: 0
    TableBasicStats:
      type: object
      required:
      - num_deleted_rows
      - num_fragments
      properties:
        num_deleted_rows:
          type: integer
          minimum: 0
          description: Number of deleted rows in the table
        num_fragments:
          type: integer
          minimum: 0
          description: Number of fragments in the table
    PageLimit:
      description: 'An inclusive upper bound of the

        number of results that a caller will receive.

        '
      type: integer
      nullable: true
    CreateTableVersionEntry:
      type: object
      description: 'An entry for creating a new table version in a batch operation.

        This supports `put_if_not_exists` semantics,

        where the operation fails if the version already exists.

        '
      required:
      - id
      - version
      - manifest_path
      properties:
        id:
          type: array
          items:
            type: string
          description: The table identifier
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version number to create
        manifest_path:
          type: string
          description: Path to the manifest file for this version
        manifest_size:
          type: integer
          format: int64
          minimum: 0
          description: Size of the manifest file in bytes
        e_tag:
          type: string
          description: Optional ETag for the manifest file
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional metadata for the version
        naming_scheme:
          $ref: '#/components/schemas/ManifestNamingScheme'
    GetTableTagVersionResponse:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: version number that the tag points to
  parameters:
    include_declared:
      name: include_declared
      description: 'When true (default), includes tables that have been declared in the namespace

        but not yet created on storage, in addition to tables that have

        been created. When false, only tables with storage

        components are returned.

        '
      in: query
      required: false
      schema:
        type: boolean
        default: true
    page_token:
      name: page_token
      description: Pagination token from a previous request
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PageToken'
    with_table_uri:
      name: with_table_uri
      description: Whether to include the table URI in the response
      in: query
      required: false
      schema:
        type: boolean
        default: false
    delimiter:
      name: delimiter
      description: 'An optional delimiter of the `string identifier`, following the Lance Namespace spec.

        When not specified, the `$` delimiter must be used.

        '
      in: query
      required: false
      schema:
        type: string
    load_detailed_metadata:
      name: load_detailed_metadata
      description: 'Whether to load detailed metadata that requires opening the dataset.

        When false (default), only `location` is required in the response.

        When true, the response includes additional metadata such as `version`, `schema`, and `stats`.

        '
      in: query
      required: false
      schema:
        type: boolean
        default: false
    id:
      name: id
      description: '`string identifier` of an object in a namespace, following the Lance Namespace spec.

        When the value is equal to the delimiter, it represents the root namespace.

        For example, `v1/namespace/$/list` performs a `ListNamespace` on the root namespace.

        '
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      description: Maximum number of items to return
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PageLimit'
    check_declared:
      name: check_declared
      description: 'Whether to check if the table exists only as a namespace declaration

        without storage data. When false (default), the response should return

        null for `is_only_declared` unless another option such as

        `load_detailed_metadata` requires the check.

        '
      in: query
      required: false
      schema:
        type: boolean
        default: false
