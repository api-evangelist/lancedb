    DescribeTableRequest:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        version:
          description: 'Version of the table to describe.

            If not specified, server should resolve it to the latest version.

            '
          type: integer
          format: int64
          minimum: 0
        with_table_uri:
          description: 'Whether to include the table URI in the response.

            Default is false.

            '
          type: boolean
          default: false
        load_detailed_metadata:
          description: 'Whether to load detailed metadata that requires opening the dataset.

            When true, the response must include all detailed metadata such as `version`, `schema`, and `stats`

            which require reading the dataset.

            When not set, the implementation can decide whether to return detailed metadata

            and which parts of detailed metadata to return.

            '
          type: boolean
        check_declared:
          description: 'Whether to check if the table exists only as a namespace declaration

            without storage data. Default is false.

            When true, the response should populate `is_only_declared`.

            When false, the implementation should return null for `is_only_declared`

            unless another option such as `load_detailed_metadata` requires

            checking declared-only table state.

            '
          type: boolean
          default: false
        vend_credentials:
          description: 'Whether to include vended credentials in the response `storage_options`.

            When true, the implementation should provide vended credentials for accessing storage.

            When not set, the implementation can decide whether to return vended credentials.

            '
          type: boolean
    DeleteFromTableResponse:
      type: object
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
        version:
          type: integer
          format: int64
          description: The commit version associated with the operation
          minimum: 0
    DescribeTableResponse:
      type: object
      properties:
        table:
          type: string
          description: 'Table name.

            Only populated when `load_detailed_metadata` is true.

            '
        namespace:
          type: array
          items:
            type: string
          description: 'The namespace identifier as a list of parts.

            Only populated when `load_detailed_metadata` is true.

            '
        version:
          type: integer
          format: int64
          minimum: 0
          description: 'Table version number.

            Only populated when `load_detailed_metadata` is true.

            '
        location:
          type: string
          description: 'Table storage location (e.g., S3/GCS path).

            '
        table_uri:
          type: string
          description: 'Table URI. Unlike location, this field must be a complete and valid URI.

            Only returned when `with_table_uri` is true.

            '
        schema:
          $ref: '#/components/schemas/JsonArrowSchema'
          description: 'Table schema in JSON Arrow format.

            Only populated when `load_detailed_metadata` is true.

            '
        storage_options:
          type: object
          description: 'Configuration options to be used to access storage. The available

            options depend on the type of storage in use. These will be

            passed directly to Lance to initialize storage access.

            When `vend_credentials` is true, this field may include vended credentials.

            If the vended credentials are temporary, the `expires_at_millis` key should be

            included to indicate the millisecond timestamp when the credentials expire.

            '
          additionalProperties:
            type: string
        stats:
          $ref: '#/components/schemas/TableBasicStats'
          nullable: true
          description: 'Table statistics.

            Only populated when `load_detailed_metadata` is true.

            '
        metadata:
          type: object
          description: 'Optional table metadata as key-value pairs. This records the information of the table

            and requires loading the table.

            It is only populated when `load_detailed_metadata` is true.

            '
          additionalProperties:
            type: string
        properties:
          type: object
          description: Properties stored on the table, if supported by the server. This records the information managed by the namespace. If the server does not support table properties, it should return null for this field. If table properties are supported, but none are set, it should return an empty object.
          additionalProperties:
            type: string
          example:
            owner: Ralph
            created_at: '1452120468'
          default: {}
          nullable: true
        managed_versioning:
          type: boolean
          description: 'When true, the caller should use namespace table version operations

            (CreateTableVersion, BatchCreateTableVersions, DescribeTableVersion, ListTableVersions, BatchDeleteTableVersions)

            to manage table versions instead of relying on Lance''s native version management.

            '
        is_only_declared:
          type: boolean
          nullable: true
          description: 'When true, indicates that the table has been declared in the namespace

            but not yet created on storage. This means the table exists in the

            namespace but has no data files on the underlying storage.

            When false, the table has storage components (data and metadata files).

            When null, the implementation did not check whether the table is only

            declared. Clients should treat an omitted value as null. Implementations

            should populate this field when `check_declared` is true or another

            option such as `load_detailed_metadata` requires checking declared-only

            table state. Operations like describe_table with load_detailed_metadata=true

            may fail for declared-only tables.

            '
