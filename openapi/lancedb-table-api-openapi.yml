          $ref: '#/components/responses/NotFoundErrorResponse'
        409:
          $ref: '#/components/responses/ConflictErrorResponse'
        503:
          $ref: '#/components/responses/ServiceUnavailableErrorResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
  /v1/table/{id}/tags/delete:
    parameters:
    - $ref: '#/components/parameters/id'
    - $ref: '#/components/parameters/delimiter'
    post:
      tags:
      - Table
      summary: Delete a tag
      operationId: DeleteTableTag
      description: 'Delete an existing tag from table `id`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTableTagRequest'
      responses:
        200:
          $ref: '#/components/responses/DeleteTableTagResponse'
        400:
          $ref: '#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        403:
          $ref: '#/components/responses/ForbiddenErrorResponse'
        404:
          $ref: '#/components/responses/NotFoundErrorResponse'
        503:
          $ref: '#/components/responses/ServiceUnavailableErrorResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
  /v1/table/{id}/tags/update:
    parameters:
    - $ref: '#/components/parameters/id'
    - $ref: '#/components/parameters/delimiter'
    post:
      tags:
      - Table
      summary: Update a tag to point to a different version
      operationId: UpdateTableTag
      description: 'Update an existing tag for table `id` to point to a different version.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableTagRequest'
      responses:
        200:
          $ref: '#/components/responses/UpdateTableTagResponse'
        400:
          $ref: '#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        403:
          $ref: '#/components/responses/ForbiddenErrorResponse'
        404:
          $ref: '#/components/responses/NotFoundErrorResponse'
        503:
          $ref: '#/components/responses/ServiceUnavailableErrorResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
components:
  schemas:
    CountTableRowsResponse:
      type: integer
      format: int64
      description: 'Response containing the count of rows.

        Serializes transparently as just the number for backward compatibility.

        '
      minimum: 0
    AlterTableDropColumnsResponse:
      type: object
      required:
      - version
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version of the table after dropping columns
    UpdateTableTagResponse:
      type: object
      description: Response for update tag operation
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
    TagContents:
      type: object
      required:
      - version
      - manifestSize
      properties:
        branch:
          type: string
          description: Branch name that the tag was created on (if any)
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version number that the tag points to
        manifestSize:
          type: integer
          format: int64
          minimum: 0
          description: Size of the manifest file in bytes
    GetTableTagVersionRequest:
      type: object
      required:
      - tag
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        tag:
          type: string
          description: Name of the tag to get version for
    ManifestNamingScheme:
      type: string
      description: "The naming scheme used for manifest files in the `_versions/` directory.\n\nKnown values:\n- `V1`: `_versions/{version}.manifest` - Simple version-based naming\n- `V2`: `_versions/{inverted_version}.manifest` - Zero-padded, reversed version number\n  (uses `u64::MAX - version`) for O(1) lookup of latest version on object stores\n\nV2 is preferred for new tables as it enables efficient latest-version discovery\nwithout needing to list all versions.\n"
      example: V2
    ListTableIndicesRequest:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
          description: The namespace identifier
        version:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Optional table version to list indexes from
        page_token:
          $ref: '#/components/schemas/PageToken'
        limit:
          $ref: '#/components/schemas/PageLimit'
    IndexContent:
      type: object
      required:
      - index_name
      - index_uuid
      - columns
      - status
      properties:
        index_name:
          type: string
          description: Name of the index
        index_uuid:
          type: string
          description: Unique identifier for the index
        columns:
          type: array
          items:
            type: string
          description: Columns covered by this index
        status:
          type: string
          description: Current status of the index
    DescribeTableVersionResponse:
      type: object
      description: Response containing the table version information
      required:
      - version
      properties:
        version:
          $ref: '#/components/schemas/TableVersion'
          description: The table version information
    DescribeTableIndexStatsResponse:
      type: object
      properties:
        distance_type:
          type: string
          nullable: true
          description: Distance type for vector indexes
        index_type:
          type: string
          nullable: true
          description: Type of the index
        num_indexed_rows:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Number of indexed rows
        num_unindexed_rows:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Number of unindexed rows
        num_indices:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Number of indices
    DeregisterTableRequest:
      type: object
      description: 'The table content remains available in the storage.

        '
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
    RenameTableRequest:
      type: object
      required:
      - new_table_name
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
          description: The table identifier
        new_table_name:
          type: string
          description: New name for the table
        new_namespace_id:
          type: array
          items:
            type: string
          description: New namespace identifier to move the table to (optional, if not specified the table stays in the same namespace)
    AlterTableBackfillColumnsResponse:
      type: object
      required:
      - job_id
      properties:
        job_id:
          type: string
          description: The job ID for tracking the backfill job
    CommitTableResult:
      type: object
      description: 'Result of a single operation within a batch commit.

        Each result corresponds to one operation in the request, in the same order.

        Exactly one of the result fields will be set.

        '
      properties:
        declare_table:
          $ref: '#/components/schemas/DeclareTableResponse'
          description: Result of a DeclareTable operation
        create_table_version:
          $ref: '#/components/schemas/CreateTableVersionResponse'
          description: Result of a CreateTableVersion operation
        delete_table_versions:
          $ref: '#/components/schemas/BatchDeleteTableVersionsResponse'
          description: Result of a DeleteTableVersions operation
        deregister_table:
          $ref: '#/components/schemas/DeregisterTableResponse'
          description: Result of a DeregisterTable operation
    VersionRange:
      type: object
      description: 'A range of versions to delete (start inclusive, end exclusive).

        Special values:

        - `start_version: 0` with `end_version: -1` means ALL versions

        '
      required:
      - start_version
      - end_version
      properties:
        start_version:
          type: integer
          format: int64
          description: 'Start version of the range (inclusive).

            Use 0 to start from the first version.

            '
        end_version:
          type: integer
          format: int64
          description: 'End version of the range (exclusive).

            Use -1 to indicate all versions up to and including the latest.

            '
    JsonArrowDataType:
      type: object
      description: JSON representation of an Apache Arrow DataType
      required:
      - type
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/JsonArrowField'
          description: Fields for complex types like Struct, Union, etc.
        length:
          type: integer
          format: int64
          description: Length for fixed-size types
          minimum: 0
        type:
          type: string
          description: The data type name
    ErrorResponse:
      type: object
      description: Common JSON error response model
      required:
      - code
      properties:
        error:
          type: string
          description: A brief, human-readable message about the error.
          example: Table 'users' not found in namespace 'production'
        code:
          type: integer
          minimum: 0
          description: "Lance Namespace error code identifying the error type.\n\nError codes:\n  0 - Unsupported: Operation not supported by this backend\n  1 - NamespaceNotFound: The specified namespace does not exist\n  2 - NamespaceAlreadyExists: A namespace with this name already exists\n  3 - NamespaceNotEmpty: Namespace contains tables or child namespaces\n  4 - TableNotFound: The specified table does not exist\n  5 - TableAlreadyExists: A table with this name already exists\n  6 - TableIndexNotFound: The specified table index does not exist\n  7 - TableIndexAlreadyExists: A table index with this name already exists\n  8 - TableTagNotFound: The specified table tag does not exist\n  9 - TableTagAlreadyExists: A table tag with this name already exists\n  10 - TransactionNotFound: The specified transaction does not exist\n  11 - TableVersionNotFound: The specified table version does not exist\n  12 - TableColumnNotFound: The specified table column does not exist\n  13 - InvalidInput: Malformed request or invalid parameters\n  14 - ConcurrentModification: Optimistic concurrency conflict\n  15 - PermissionDenied: User lacks permission for this operation\n  16 - Unauthenticated: Authentication credentials are missing or invalid\n  17 - ServiceUnavailable: Service is temporarily unavailable\n  18 - Internal: Unexpected server/implementation error\n  19 - InvalidTableState: Table is in an invalid state for the operation\n  20 - TableSchemaValidationError: Table schema validation failed\n"
          example: 4
        detail:
          type: string
          description: 'An optional human-readable explanation of the error.

            This can be used to record additional information such as stack trace.

            '
          example: The table may have been dropped or renamed
        instance:
          type: string
          description: 'A string that identifies the specific occurrence of the error.

            This can be a URI, a request or response ID,

            or anything that the implementation can recognize to trace specific occurrence of the error.

            '
          example: /v1/table/production$users/describe
    MultiMatchQuery:
      type: object
      required:
      - match_queries
      properties:
        match_queries:
          type: array
          items:
            $ref: '#/components/schemas/MatchQuery'
    AlterColumnsEntry:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          description: Column path to alter
        data_type:
          type: object
          description: New data type for the column using JSON representation (optional)
        rename:
          type:
          - string
          - 'null'
          description: New name for the column (optional)
        nullable:
          type:
          - boolean
          - 'null'
          description: Whether the column should be nullable (optional)
        virtual_column:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlterVirtualColumnEntry'
          description: Virtual column alterations (optional)
    DeleteTableTagResponse:
      type: object
      description: Response for delete tag operation
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
    ExplainTableQueryPlanRequest:
      type: object
      required:
      - query
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/QueryTableRequest'
        verbose:
          type: boolean
          default: false
          description: Whether to return verbose explanation
    JsonArrowSchema:
      type: object
      description: 'JSON representation of a Apache Arrow schema.

        '
      required:
      - fields
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/JsonArrowField'
        metadata:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
    DropTableIndexResponse:
      type: object
      description: Response for drop index operation
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
    RestoreTableResponse:
      type: object
      description: Response for restore table operation
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
    AlterTableAddColumnsRequest:
      type: object
      required:
      - new_columns
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        id:
          type: array
          items:
            type: string
          description: Table identifier path (namespace + table name)
        new_columns:
          type: array
          items:
            $ref: '#/components/schemas/AddColumnsEntry'
          description: List of new columns to add to the table
    DeclareTableResponse:
      type: object
      description: 'Response for declaring a table.

        '
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
        location:
          type: string
        storage_options:
          type: object
          description: 'Configuration options to be used to access storage. The available

            options depend on the type of storage in use. These will be

            passed directly to Lance to initialize storage access.

            '
          additionalProperties:
            type: string
        properties:
          type: object
          description: 'If the implementation does not support table properties, it should return null for this field. Otherwise it should return the properties.

            '
          additionalProperties:
            type: string
          example:
            owner: Ralph
            created_at: '1452120468'
          default: {}
          nullable: true
        managed_versioning:
          type: boolean
          description: 'When true, the caller should use namespace table version operations

            (CreateTableVersion, BatchCreateTableVersions, DescribeTableVersion, ListTableVersions, BatchDeleteTableVersions)

            to manage table versions instead of relying on Lance''s native version management.

            '
    TableExistsRequest:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        version:
          description: 'Version of the table to check existence.

            If not specified, server should resolve it to the latest version.

            '
          type: integer
          format: int64
          minimum: 0
    AddColumnsEntry:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the new column
        expression:
          type:
          - string
          - 'null'
          description: SQL expression for the column (optional if virtual_column is specified)
        virtual_column:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AddVirtualColumnEntry'
          description: Virtual column definition (optional if expression is specified)
    BatchDeleteTableVersionsResponse:
      type: object
      description: Response for deleting table version records
      properties:
        deleted_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of version records deleted
        transaction_id:
          type: string
          description: Optional transaction identifier
    AddVirtualColumnEntry:
      type: object
      required:
      - input_columns
      - data_type
      - image
      - udf_version
      - udf_name
      - udf
      properties:
        input_columns:
          type: array
          items:
            type: string
          description: List of input column names for the virtual column
        data_type:
          type: object
          description: Data type of the virtual column using JSON representation
        image:
          type: string
          description: Docker image to use for the UDF
        udf:
          type: string
          description: Base64 encoded pickled UDF
        udf_name:
          type: string
          description: Name of the UDF
        udf_version:
          type: string
          description: Version of the UDF
        udf_backend:
          type:
          - string
          - 'null'
          description: UDF backend type (e.g. DockerUDFSpecV1)
        auto_backfill:
          type:
          - boolean
          - 'null'
          description: Whether to automatically backfill the column after creation
        manifest:
          type:
          - string
          - 'null'
          description: JSON-serialized manifest for the UDF environment
        manifest_checksum:
          type:
          - string
          - 'null'
          description: SHA-256 checksum of the manifest content
        field_metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: User-supplied field metadata (string key-value pairs)
    QueryTableRequest:
      type: object
      required:
      - vector
      - k
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        bypass_vector_index:
          type: boolean
          description: Whether to bypass vector index
        columns:
          type: object
          nullable: true
          description: 'Optional columns to return. Provide either column_names or column_aliases, not both.

            '
          properties:
            column_names:
              type: array
              items:
                type: string
              description: List of column names to return
            column_aliases:
              type: object
              additionalProperties:
                type: string
              description: Object mapping output aliases to source column names
        distance_type:
          type: string
          description: Distance metric to use
        ef:
          type: integer
          minimum: 0
          description: Search effort parameter for HNSW index
        fast_search:
          type: boolean
          description: Whether to use fast search
        filter:
          type: string
          description: Optional SQL filter expression
        full_text_query:
          type: object
          nullable: true
          description: Optional full-text search query. Provide either string_query or structured_query, not both.
          properties:
            string_query:
              $ref: '#/components/schemas/StringFtsQuery'
            structured_query:
              $ref: '#/components/schemas/StructuredFtsQuery'
        k:
          type: integer
          minimum: 0
          description: Number of results to return
        lower_bound:
          type: number
          format: float
          description: Lower bound for search
        nprobes:
          type: integer
          minimum: 0
          description: Number of probes for IVF index
        offset:
          type: integer
          minimum: 0
          description: Number of results to skip
        prefilter:
          type: boolean
          description: Whether to apply filtering before vector search
        refine_factor:
          type: integer
          format: int32
          minimum: 0
          description: Refine factor for search
        upper_bound:
          type: number
          format: float
          description: Upper bound for search
        vector:
          type: object
          nullable: true
          description: Query vector(s) for similarity search. Provide either single_vector or multi_vector, not both.
          properties:
            single_vector:
              type: array
              items:
                type: number
                format: float
              description: Single query vector
            multi_vector:
              type: array
              items:
                type: array
                items:
                  type: number
                  format: float
              description: Multiple query vectors for batch search
        vector_column:
          type: string
          description: Name of the vector column to search
        version:
          type: integer
          format: int64
          minimum: 0
          description: Table version to query
        with_row_id:
          type: boolean
          description: If true, return the row id as a column called `_rowid`
    UpdateTableResponse:
      type: object
      required:
      - updated_rows
      - version
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
        updated_rows:
          type: integer
          format: int64
          description: Number of rows updated
          minimum: 0
        version:
          type: integer
          format: int64
          description: The commit version associated with the operation
          minimum: 0
        properties:
          type: object
          description: 'If the implementation does not support table properties, it should return null for this field. Otherwise, it should return the properties.

            '
          additionalProperties:
            type: string
    CommitTableOperation:
      type: object
      description: 'A single operation within a batch commit.

        Provide exactly one of the operation fields to specify the operation kind.

        '
      properties:
        declare_table:
          $ref: '#/components/schemas/DeclareTableRequest'
          description: Declare (reserve) a new table in the namespace
        create_table_version:
          $ref: '#/components/schemas/CreateTableVersionRequest'
          description: Create a new version entry for a table
        delete_table_versions:
          $ref: '#/components/schemas/BatchDeleteTableVersionsRequest'
          description: Delete version ranges from a table
        deregister_table:
          $ref: '#/components/schemas/DeregisterTableRequest'
          description: Deregister (soft-delete) a table
    BatchCommitTablesRequest:
      type: object
      description: 'Request to atomically commit a batch of table operations.

        This replaces `BatchCreateTableVersionsRequest` with a more general interface

        that supports mixed operations (DeclareTable, CreateTableVersion,

        DeleteTableVersions, DeregisterTable)

        within a single atomic transaction at the metadata layer.


        All operations are committed atomically: either all succeed or none are applied.

        '
      required:
      - operations
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/CommitTableOperation'
          description: 'List of operations to commit atomically.

            Supported operation types: DeclareTable, CreateTableVersion,

            DeleteTableVersions, DeregisterTable.

            '
    BatchDeleteTableVersionsRequest:
      type: object
      description: 'Request to delete table version records.

        Supports deleting ranges of versions for efficient bulk cleanup.

        '
      required:
      - ranges
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
          description: The table identifier
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/VersionRange'
          description: 'List of version ranges to delete.

            Each range specifies start (inclusive) and end (exclusive) versions.

            '
    DeleteFromTableRequest:
      type: object
      description: 'Delete data from table based on a SQL predicate.

        Returns the number of rows that were deleted.

        '
      required:
      - predicate
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
          description: The namespace identifier
        predicate:
          type: string
          description: SQL predicate to filter rows for deletion
    DeleteTableTagRequest:
      type: object
      required:
      - tag
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        tag:
          type: string
          description: Name of the tag to delete
    CreateTableVersionResponse:
      type: object
      description: Response for creating a table version
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
        version:
          $ref: '#/components/schemas/TableVersion'
    FragmentStats:
      type: object
      required:
      - num_fragments
      - num_small_fragments
      - lengths
      properties:
        num_fragments:
          type: integer
          format: int64
          minimum: 0
          description: The number of fragments in the table
        num_small_fragments:
          type: integer
          format: int64
          minimum: 0
          description: The number of uncompacted fragments in the table
        lengths:
          $ref: '#/components/schemas/FragmentSummary'
          description: Statistics on the number of rows in the table fragments
    ListTablesResponse:
      type: object
      required:
      - tables
      properties:
        tables:
          type: array
          uniqueItems: true
          description: 'The list of names of all the tables under the connected namespace implementation.

            This should recursively list all the tables in all child namespaces.

            Each string in the list is the full identifier in string form.

            '
          items:
            type: string
        page_token:
          $ref: '#/components/schemas/PageToken'
    CreateTableIndexResponse:
      type: object
      description: Response for create index operation
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
    MergeInsertIntoTableResponse:
      type: object
      description: Response from merge insert operation
      properties:
        transaction_id:
          type: string
          description: Optional transaction identifier
        num_updated_rows:
          type: integer
          format: int64
          description: Number of rows updated
          minimum: 0
        num_inserted_rows:
          type: integer
          format: int64
          description: Number of rows inserted
          minimum: 0
        num_deleted_rows:
          type: integer
          format: int64
          description: Number of rows deleted (typically 0 for merge insert)
          minimum: 0
        version:
          type: integer
          format: int64
          description: The commit version associated with the operation
          minimum: 0
    RestoreTableRequest:
      type: object
      required:
      - version
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
          $ref: '#/components/schemas/Context'
        id:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version to restore to
    RegisterTableRequest:
      type: object
      required:
      - location
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        context:
